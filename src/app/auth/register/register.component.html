<div class="register-container">
  <div class="register-card">

    <div class="register-header">
      <div class="register-icon">
        <i class="bi bi-person-plus"></i>
      </div>

      <h1>Crear cuenta</h1>
      <p>Regístrate para comenzar</p>
    </div>

    <form [formGroup]="formRegister" (ngSubmit)="registrarUsuario()" class="register-form">

      <div class="input-group">
        <label for="name">Nombre completo</label>
        <input
          formControlName="name"
          type="text"
          id="name"
          placeholder="Ingresa tu nombre"
          autocomplete="name"
          required
        />
        <small *ngIf="formRegister.get('name')?.touched && formRegister.get('name')?.invalid">
          Ingresa tu nombre completo.
        </small>
      </div>

      <div class="input-group">
        <label for="email">Correo electrónico</label>
        <input
          formControlName="email"
          type="email"
          id="email"
          placeholder="Ingresa tu correo"
          autocomplete="email"
          required
        />
        <small *ngIf="formRegister.get('email')?.touched && formRegister.get('email')?.invalid">
          Ingresa un correo electrónico válido.
        </small>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input
          formControlName="password"
          type="password"
          id="password"
          placeholder="Crea una contraseña"
          autocomplete="new-password"
          required
        />
        <small *ngIf="formRegister.get('password')?.touched && formRegister.get('password')?.invalid">
          La contraseña debe tener al menos 6 caracteres.
        </small>
      </div>

      <div class="input-group">
        <label for="confirmPassword">Confirmar contraseña</label>
        <input
          formControlName="confirmPassword"
          type="password"
          id="confirmPassword"
          placeholder="Repite tu contraseña"
          autocomplete="new-password"
          required
        />
        <small *ngIf="formRegister.get('confirmPassword')?.touched && formRegister.hasError('passwordMismatch')">
          Las contraseñas no coinciden.
        </small>
      </div>

      <button type="submit" class="register-button">
        Registrarme
      </button>

    </form>

    <div class="register-footer">
      <p>¿Ya tienes una cuenta?
        <a routerLink="/auth/login">Inicia sesión aquí</a>
      </p>
    </div>

  </div>
</div>
